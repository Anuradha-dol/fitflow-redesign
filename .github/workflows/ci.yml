name: FitFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required lab files
        run: |
          test -f README.md
          test -f .gitignore
          test -f docs/architecture-diagram.png
          test -f docs/architecture-decision-record.md
          test -f docs/comparison-matrix.md
          test -f docs/tech-stack-summary.md
          test -d frontend
          test -d backend
          test -d ai-service
          echo "FitFlow repository structure is valid."

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Build backend
        working-directory: backend
        run: npm run build

  ai-service-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Compile AI service
        working-directory: ai-service
        run: python -m compileall main.py

  frontend-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze frontend
        working-directory: frontend
        run: flutter analyze
